<title>AI memory landscape</title>
<!--
  The AI memory landscape for github.com/topoteretes/awesome-ai-memory (CLO-1604), in the design system's look on
  GitHub's dark colours: page and panels #161b22, lines #484f58, text #e6edf3 / #8d96a0. Columns by colour, as each
  panel's top bar, its label and its marks: graph #eeeeee, both lavender #bc9bff, vector green #8cff86.
  Every company is a tile: its mark in its column's colour, its name under it. Tiles touch, three to a row, and share
  their lines with the panel edges and row lines. The row names stand on both sides, leaning on the panels; each
  section's name is centred over them. No title, counts, legend or footer: the chart is the two sections.
  Companies are DATA below; marks/ holds each one's mark in one colour, from its current logo (Simple Icons, the project's
  GitHub, README or site) or, where none was found, cut from infographic_v7.png. TWK Lausanne is licensed, so it is not in
  this repo: put TWKLausanne-300/700.woff2 in fonts/ (ignored by git) to preview and export. Export: open this page and
  screenshot #chart at 2317 / 1100 device pixels per CSS pixel. The chart is 1100 wide and as tall as its content
  (1046 now), so the PNG is 2317 wide (2317 × 2203 now).
-->
<style>
@font-face { font-family: TWKLausanne; font-weight: 300; src: local("TWK Lausanne Light"), url(fonts/TWKLausanne-300.woff2) format("woff2"); }
@font-face { font-family: TWKLausanne; font-weight: 700; src: local("TWK Lausanne Bold"), url(fonts/TWKLausanne-700.woff2) format("woff2"); }
:root {
  /* the design system's tokens (cognee-*) */
  /* GitHub dark (the README's own colours): page #0d1117, panels #161b22, borders #30363d, text #e6edf3 / #8d96a0 */
  --page: #161b22; --panel: #161b22;   /* the page the same colour as the panels */ --fg: #e6edf3; --subtle: #8d96a0; --faint: rgba(230, 237, 243, .40);
  --frame: #484f58; --frame-strong: #6e7681;   /* GitHub's stronger borders: the table reads clearly */
  --lavender: #bc9bff; --green: #8cff86; --grey: #eeeeee;   /* graph */
  /* on dark, the brand colours read as text as they are */
  --lavender-ink: #bc9bff; --green-ink: #8cff86;
  --mark: var(--fg);
  --grid: linear-gradient(rgba(230, 237, 243, .04) 1px, transparent 1px), linear-gradient(90deg, rgba(230, 237, 243, .04) 1px, transparent 1px);
  --font: TWKLausanne, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
body { background: #161b22; font-family: var(--font); color: var(--fg); -webkit-font-smoothing: antialiased; }
#chart { width: 1100px;   /* as tall as its content */ padding: 44px 48px 36px; display: flex; flex-direction: column; background: var(--page) var(--grid); background-size: 16px 16px; }
/* the label: 11/16, bold, uppercase, spaced (SectionLabel) */
.label { font: 700 11px/16px var(--font); letter-spacing: .05em; text-transform: uppercase; }
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 32px; }
header .label { color: var(--lavender-ink); }
header h1 { margin-top: 8px; font: 300 38px/46px var(--font); }                 /* text-display */
header p { margin-top: 8px; font: 300 14px/20px var(--font); color: var(--subtle); max-width: 620px; }   /* text-sm */
.legend { display: flex; gap: 20px; margin-top: 14px; }
.legend span { display: flex; align-items: center; gap: 8px; font: 300 14px/20px var(--font); color: var(--subtle); }
.legend i { width: 10px; height: 10px; }
.brand { display: none; }   /* no logotype in the header (CLO-1604); its svg is kept as the source for the cognee tile */
header { display: none; }
header + section { margin-top: 0; }   /* nothing above the first section now */
.brand svg { display: block; height: 20px; width: auto; }
section { flex: 0 0 auto; display: flex; flex-direction: column; min-height: 0; margin-top: 28px; }
.sec-head { display: flex; justify-content: center; align-items: baseline; gap: 10px; margin-bottom: 12px; }   /* centred over the panels */
.sec-head h2 { font: 300 20px/28px var(--font); }                              /* SectionHeader, text-xl */
.sec-head span { font: 300 14px/20px var(--font); color: var(--subtle); }
.grid { flex: 0 0 auto; align-content: start; display: grid; grid-template-columns: 112px repeat(3, 1fr) 112px;   /* the row names on both sides */ grid-template-rows: auto repeat(4, auto);   /* each row as tall as its tiles */ column-gap: 12px; }
.panel { grid-row: 1 / -1; background: var(--panel); border: 1px solid var(--frame); position: relative; }
.panel::before { content: ""; position: absolute; left: -1px; right: -1px; top: -1px; height: 2px; }
.k-graph.panel::before { background: var(--grey); } .k-vector.panel::before { background: var(--green); } .k-both.panel::before { background: var(--lavender); }
.col-head { grid-row: 1; padding: 12px 14px 10px; z-index: 1; }
.col-head.k-graph { color: var(--grey); } .col-head.k-vector { color: var(--green-ink); } .col-head.k-both { color: var(--lavender-ink); }
.row-name { padding: 13px 0 0; color: var(--subtle); border-top: 1px solid var(--frame); z-index: 1; }
.row-name { text-align: right; }   /* the row names lean on the panels: the left ones end at the graph panel… */
.row-name.right { text-align: left; }   /* …the right ones start at the vector panel */
.cell { padding: 0; border-top: 1px solid var(--frame);   /* tiles run to the panel edges and the row lines */ display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-content: start; gap: 0; z-index: 1; min-height: 46px; }   /* the marks on a grid, three to a row */
.cell.k-graph { --mark: var(--grey); } .cell.k-both { --mark: var(--lavender); } .cell.k-vector { --mark: var(--green); }   /* each mark in its column's colour: graph grey, both lavender, vector green */
.mark { display: block; background: var(--mark); -webkit-mask: var(--src) center / contain no-repeat; mask: var(--src) center / contain no-repeat; }
.mark.cognee { background: none; color: var(--mark); }
.mark.cognee svg { display: block; width: 100%; height: 100%; }
/* each company: a tile of one height with a hairline frame, its mark centred and its name under it (CLO-1604) */
.co { margin: 0 0 -1px 0; height: 77px;   /* only right and bottom lines: the panel edge and the row line close the rest, so every line is one hairline */ padding: 10px 6px 8px; border: 0; border-right: 1px solid var(--frame); border-bottom: 1px solid var(--frame); background: transparent;   /* the panel behind is the fill; a filled tile would paint over the line of the tile above */ display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-width: 0; }
.co .box { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; max-width: 100%; }
.co figcaption { font: 300 10px/12px var(--font); color: var(--subtle); text-align: center; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
footer { display: flex; justify-content: space-between; margin-top: 18px; font: 300 12px/20px var(--font); color: var(--faint); }   /* text-xs */
</style>
